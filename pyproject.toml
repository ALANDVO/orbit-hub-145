[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "orbit-hub-145"
version = "0.1.0"
description = "PageIndex: Document Index for Vectorless, Reasoning-based RAG"
readme = "README.md"
authors = [{name = "Alan Vo", email = "alanvo@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23.0",
    "pydantic>=2.0",
    "mcp>=1.19.0,<3",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.3.0",
    "mypy>=1.5.0",
]

[project.scripts]
pageindex-mcp = "pageindex.mcp_server:main"

[tool.poetry]
name = "orbit-hub-145"
version = "0.1.0"
description = "PageIndex: Document Index for Vectorless, Reasoning-based RAG"
authors = ["Alan Vo <alanvo@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "pageindex"}]

[tool.poetry.dependencies]
python = "^3.10"
pymupdf = "^1.23.0"
pydantic = "^2.0"
mcp = ">=1.19.0,<3"
openai = "^1.0.0"
anthropic = "^0.25.0"
httpx = "^0.25.0"
numpy = "^1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
ruff = "^0.3.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
pageindex-mcp = "pageindex.mcp_server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
